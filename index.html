<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickBasket - Local Shopping</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f8f5;
  color: #222;
}

header {
  background: #087f45;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin-bottom: 0;
}

.top {
  padding: 15px;
  text-align: center;
}

input {
  width: 90%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}

.cartbtn {
  background: #ff9f1c;
  color: white;
  border: none;
  padding: 13px 22px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  margin-top: 12px;
}

.categories {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px;
}

.categories button {
  border: none;
  background: white;
  padding: 12px 17px;
  border-radius: 20px;
  white-space: nowrap;
}

.categories button.active {
  background: #087f45;
  color: white;
}

h2 {
  padding-left: 15px;
}

.products {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 12px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 2px 7px #ddd;
}

.emoji {
  font-size: 42px;
}

.card h3 {
  font-size: 16px;
}

.price {
  color: #087f45;
  font-weight: bold;
}

.add {
  background: #087f45;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 8px;
  width: 100%;
  margin-top: 8px;
}

.quantity {
  color: #087f45;
  font-weight: bold;
  margin-top: 8px;
}

#cartBox {
  background: white;
  margin: 15px;
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #ccc;
}

#cartBox[hidden] {
  display: none;
}

.cartrow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #ddd;
  padding: 12px 0;
  gap: 8px;
}

.qty button {
  background: #087f45;
  color: white;
  border: none;
  padding: 7px 12px;
  border-radius: 5px;
  font-size: 16px;
}

.total {
  font-size: 20px;
  font-weight: bold;
}

.checkout {
  background: #ff9f1c;
  color: white;
  padding: 13px;
  border: none;
  border-radius: 8px;
  width: 100%;
  font-size: 17px;
}

footer {
  background: #087f45;
  color: white;
  text-align: center;
  padding: 20px;
  margin-top: 25px;
}
</style>
</head>

<body>

<header>
<h1>🛒 QuickBasket</h1>
<p>Your Local Market, Now Online!</p>
</header>

<div class="top">
<input
type="text"
id="search"
placeholder="Search products..."
oninput="showProducts()">

<br>

<button class="cartbtn" onclick="toggleCart()">
🛒 My Cart (<span id="cartCount">0</span>)
</button>
</div>

<div class="categories">
<button class="active" onclick="filterCategory('All',this)">All</button>
<button onclick="filterCategory('Grocery',this)">Grocery</button>
<button onclick="filterCategory('Fruits',this)">Fruits</button>
<button onclick="filterCategory('Vegetables',this)">Vegetables</button>
<button onclick="filterCategory('Bakery',this)">Bakery</button>
<button onclick="filterCategory('Dairy',this)">Dairy</button>
</div>

<h2>🛍️ Our Products</h2>

<div class="products" id="productList"></div>

<section id="cartBox" hidden>

<h2>🛒 Your Shopping Cart</h2>

<div id="cartItems"></div>

<p class="total">
Total: ₹<span id="total">0</span>
</p>

<button class="checkout" onclick="placeOrder()">
Place Order
</button>

<br><br>

<button class="add" onclick="toggleCart()">
Continue Shopping
</button>

</section>

<footer>
<h2 style="color:white">QuickBasket 💚</h2>
<p>Your Local Market, Now Online!</p>
<p>Miraj & Sangli</p>
</footer>

<script>

const items = [

{name:"Rice",price:60,emoji:"🍚",category:"Grocery"},
{name:"Wheat Flour",price:40,emoji:"🌾",category:"Grocery"},
{name:"Cooking Oil",price:150,emoji:"🛢️",category:"Grocery"},
{name:"Sugar",price:45,emoji:"🍬",category:"Grocery"},

{name:"Apple",price:120,emoji:"🍎",category:"Fruits"},
{name:"Banana",price:50,emoji:"🍌",category:"Fruits"},
{name:"Grapes",price:80,emoji:"🍇",category:"Fruits"},
{name:"Orange",price:70,emoji:"🍊",category:"Fruits"},

{name:"Tomato",price:30,emoji:"🍅",category:"Vegetables"},
{name:"Potato",price:25,emoji:"🥔",category:"Vegetables"},
{name:"Onion",price:35,emoji:"🧅",category:"Vegetables"},
{name:"Carrot",price:40,emoji:"🥕",category:"Vegetables"},

{name:"Bread",price:35,emoji:"🍞",category:"Bakery"},
{name:"Pav",price:30,emoji:"🥖",category:"Bakery"},
{name:"Cake",price:100,emoji:"🎂",category:"Bakery"},
{name:"Biscuits",price:20,emoji:"🍪",category:"Bakery"},

{name:"Milk",price:30,emoji:"🥛",category:"Dairy"},
{name:"Curd",price:40,emoji:"🥣",category:"Dairy"},
{name:"Paneer",price:90,emoji:"🧀",category:"Dairy"},
{name:"Butter",price:55,emoji:"🧈",category:"Dairy"}

];

let cart = {};
let currentCategory = "All";

function showProducts(){

let search = document.getElementById("search").value.toLowerCase();

let html = "";

items.forEach((p,index)=>{

if(currentCategory !== "All" && p.category !== currentCategory) return;

if(!p.name.toLowerCase().includes(search)) return;

let qty = cart[index] || 0;

html += `
<div class="card">

<div class="emoji">${p.emoji}</div>

<h3>${p.name}</h3>

<p class="price">₹${p.price}</p>

<p>${p.category}</p>

<button class="add" onclick="addCart(${index})">
Add to Cart
</button>

<div class="quantity">
In Cart: ${qty}
</div>

</div>
`;

});

document.getElementById("productList").innerHTML =
html || "<p>No products found.</p>";

}

function filterCategory(category,button){

currentCategory = category;

document.querySelectorAll(".categories button").forEach(btn=>{
btn.classList.remove("active");
});

button.classList.add("active");

showProducts();

}

function addCart(index){

cart[index] = (cart[index] || 0) + 1;

updateCart();

showProducts();

}

function changeQty(index,change){

cart[index] = (cart[index] || 0) + change;

if(cart[index] <= 0){
delete cart[index];
}

updateCart();

showProducts();

}

function updateCart(){

let count = 0;
let total = 0;
let html = "";

Object.keys(cart).forEach(key=>{

let index = Number(key);
let p = items[index];
let qty = cart[index];

count += qty;
total += p.price * qty;

html += `
<div class="cartrow">

<div>
${p.emoji} ${p.name}
<br>
₹${p.price} × ${qty}
</div>

<div class="qty">

<button onclick="changeQty(${index},-1)">−</button>

${qty}

<button onclick="changeQty(${index},1)">+</button>

</div>

</div>
`;

});

document.getElementById("cartCount").innerText = count;

document.getElementById("cartItems").innerHTML =
html || "<p>Your cart is empty.</p>";

document.getElementById("total").innerText = total;

}

function toggleCart(){

let box = document.getElementById("cartBox");

box.hidden = !box.hidden;

updateCart();

if(!box.hidden){
box.scrollIntoView({behavior:"smooth"});
}

}

function placeOrder(){

if(Object.keys(cart).length === 0){

alert("Please add products first!");

return;

}

alert("Demo only: Real order booking will be added after backend setup.");

}

showProducts();
updateCart();

</script>

</body>
</html>
