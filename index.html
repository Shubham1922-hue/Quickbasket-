<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickBasket | Your Local Market, Now Online!</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7faf7;color:#222}
header{background:#087f4f;color:white;padding:20px;text-align:center}
.logo{font-size:30px;font-weight:bold}
header p{margin:7px}
.search{padding:15px;text-align:center}
.search input{width:90%;max-width:500px;padding:13px;border:1px solid #ddd;border-radius:25px;font-size:16px}
h2{text-align:center;color:#087f4f}
.categories{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:10px}
.categories button{background:white;border:1px solid #ddd;padding:12px 18px;border-radius:20px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding:15px;max-width:850px;margin:auto}
.card{background:white;border-radius:12px;padding:15px;text-align:center;box-shadow:0 2px 8px #ddd}
.card .emoji{font-size:45px}
.card h3{margin:8px}
.card button{background:#087f4f;color:white;border:0;padding:10px 18px;border-radius:8px}
footer{text-align:center;background:#087f4f;color:white;padding:18px;margin-top:25px}
</style>
</head>
<body>

<header>
<div class="logo">🛒 QuickBasket</div>
<p>Your Local Market, Now Online!</p>
<p>📍 Miraj & Sangli</p>
</header>

<div class="search">
<input type="text" id="search" placeholder="Search groceries, fruits, vegetables..." oninput="searchProducts()">
</div>

<h2>Shop by Category</h2>
  <button onclick="filterProducts('bakery')">🥐 Bakery</button>
<button onclick="filterProducts('dairy')">🥛 Dairy</button>
<div class="categories">
<button onclick="filterProducts('all')">All</button>
<button onclick="filterProducts('grocery')">🛍️ Grocery</button>
<button onclick="filterProducts('fruits')">🍎 Fruits</button>
<button onclick="filterProducts('vegetables')">🥦 Vegetables</button>
</div>

<h2>Popular Products</h2>
<div class="products" id="products"></div>

<footer>
<strong>QuickBasket</strong>
<p>Supporting Local Shops in Miraj & Sangli ❤️</p>
</footer>

<script>
const items=[
{name:"Rice",price:60,emoji:"🍚",category:"grocery"},
{name:"Wheat Flour",price:40,emoji:"🌾",category:"grocery"},
{name:"Cooking Oil",price:150,emoji:"🫗",category:"grocery"},
{name:"Sugar",price:45,emoji:"🍬",category:"grocery"},
{name:"Apple",price:120,emoji:"🍎",category:"fruits"},
{name:"Banana",price:50,emoji:"🍌",category:"fruits"},
{name:"Tomato",price:30,emoji:"🍅",category:"vegetables"},
{name:"Potato",price:25,emoji:"🥔",category:"vegetables"}
];
  {name:"Bread",price:40,emoji:"🍞",category:"bakery"},
{name:"Pav",price:30,emoji:"🥖",category:"bakery"},
{name:"Cake",price:100,emoji:"🎂",category:"bakery"},
{name:"Biscuits",price:30,emoji:"🍪",category:"bakery"},
{name:"Milk",price:30,emoji:"🥛",category:"dairy"},
{name:"Curd",price:40,emoji:"🥣",category:"dairy"},
{name:"Paneer",price:90,emoji:"🧀",category:"dairy"},
{name:"Butter",price:60,emoji:"🧈",category:"dairy"}
let category="all";
let cart=[];
function displayProducts(){
let q=document.getElementById("search").value.toLowerCase();
let filtered=items.filter(p=>(category==="all"||p.category===category)&&p.name.toLowerCase().includes(q));
document.getElementById("products").innerHTML=filtered.map((p,i)=>`
<div class="card">
<div class="emoji">${p.emoji}</div>
<h3>${p.name}</h3>
<p>₹${p.price} / kg or unit</p>
<button onclick="addCart('${p.name}')">Add to Cart</button>
</div>`).join("");
}
function filterProducts(c){category=c;displayProducts()}
function searchProducts(){displayProducts()}
function addCart(name){cart.push(name);alert(name+" added to cart! Total items: "+cart.length)}
displayProducts();
</script>
</body>
</html>
