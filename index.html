<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickBasket - Customer Dashboard</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f5f7;
 color:#222;
}

header{
 background:linear-gradient(135deg,#064e35,#079653);
 padding:25px 15px;
 text-align:center;
 color:white;
 border-radius:0 0 25px 25px;
 box-shadow:0 5px 15px #0002;
}

.brand-logo{
 font-size:35px;
 background:white;
 width:65px;
 height:65px;
 border-radius:20px;
 display:flex;
 align-items:center;
 justify-content:center;
 margin:0 auto 8px;
}

.brand-name h1{
 font-size:32px;
 margin:5px 0;
 font-weight:900;
 letter-spacing:-1px;
}

.brand-name h1 span{color:#b8ffcf}

.brand-name p{
 margin:5px 0 12px;
 font-size:12px;
}

.dashboard-label{
 font-size:11px;
 letter-spacing:2px;
 font-weight:bold;
 background:#ffffff25;
 display:inline-block;
 padding:7px 15px;
 border-radius:20px;
}

.container{
 max-width:1000px;
 margin:auto;
 padding:15px;
}

.card{
 background:white;
 padding:17px;
 border-radius:13px;
 margin-bottom:15px;
 box-shadow:0 2px 9px #0001;
}

h3{
 margin-top:0;
 color:#087c45;
}

button{
 border:0;
 padding:12px 16px;
 border-radius:8px;
 font-weight:bold;
 cursor:pointer;
}

.primary{
 background:#087c45;
 color:white;
}

.danger{
 background:#dc3545;
 color:white;
}

.warning{
 background:#f0a500;
 color:white;
}

input,select,textarea{
 width:100%;
 padding:12px;
 margin:7px 0 13px;
 border:1px solid #ccc;
 border-radius:7px;
 font-size:15px;
}

.hero{
 background:linear-gradient(135deg,#e1f7e9,#f5fff8);
 padding:25px;
 border-radius:13px;
 margin-bottom:15px;
}

.hero h2{
 color:#075b36;
 margin-top:0;
}

.search-box{
 display:flex;
 gap:8px;
}

.search-box input{margin:0}

.categories{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding:5px 0 12px;
}

.category{
 min-width:100px;
 padding:14px 10px;
 background:#f3f5f7;
 border-radius:10px;
 text-align:center;
 cursor:pointer;
 font-weight:bold;
}

.category span{
 display:block;
 font-size:27px;
 margin-bottom:7px;
}

.category.active{
 background:#087c45;
 color:white;
}

.products{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
 gap:13px;
}

.product{
 background:white;
 border:1px solid #eee;
 border-radius:11px;
 padding:12px;
}

.product-image{
 height:100px;
 display:flex;
 justify-content:center;
 align-items:center;
 background:#e8f7ee;
 border-radius:9px;
 font-size:48px;
 margin-bottom:10px;
}

.product h4{margin:5px 0}

.product p{
 color:#777;
 font-size:13px;
}

.price{
 color:#087c45;
 font-size:19px;
 font-weight:bold;
 margin:10px 0;
}

.product button{
 width:100%;
}

.cart-item{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 padding:12px 0;
 border-bottom:1px solid #eee;
}

.qty{
 display:flex;
 align-items:center;
 gap:8px;
}

.qty button{
 padding:6px 10px;
 background:#e8f7ee;
 color:#087c45;
}

.total{
 font-size:21px;
 font-weight:bold;
 color:#087c45;
 margin:15px 0;
}

.badge{
 display:inline-block;
 padding:5px 10px;
 border-radius:20px;
 background:#e7f5ec;
 color:#087c45;
 font-size:12px;
 font-weight:bold;
}

.full-btn{
 width:100%;
}

.small-text{
 font-size:13px;
 color:#666;
}

footer{
 text-align:center;
 padding:20px;
 color:#777;
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0009;
 z-index:1000;
 justify-content:center;
 align-items:center;
 padding:15px;
}

.modal-box{
 background:white;
 width:100%;
 max-width:450px;
 padding:20px;
 border-radius:13px;
 max-height:90vh;
 overflow:auto;
}

.modal-box h3{margin-top:0}

.close{
 float:right;
 background:#eee
